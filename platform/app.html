<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jericho</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div class="spinner"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

  <!-- Jericho modules -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/invitations.js"></script>
  <script src="js/commodities.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/listings.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Initialize Firebase
    firebase.initializeApp(window.JERICHO_FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Make db globally available for app.js helpers
    window.db = db;

    // Initialize all modules
    JerichoAuth.init(auth, db);
    JerichoInvitations.init(db);
    JerichoCommodities.init(db);
    JerichoStorage.init(storage, db);
    JerichoListings.init(db);
    JerichoApp.init();

    // Pre-load commodities once authenticated
    window.addEventListener('jericho-auth-changed', async (e) => {
      if (e.detail.user && e.detail.profile && 
          (e.detail.profile.status === 'approved' || e.detail.profile.role === 'operator')) {
        try {
          await JerichoCommodities.loadAll();
        } catch (err) {
          console.warn('Could not load commodities:', err);
        }
      }
    });
  </script>
</body>
</html>
